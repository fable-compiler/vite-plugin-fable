name: PR

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore

      - name: Install node_modules
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Test plugin
        run: bun run test:plugin

      - name: Test daemon
        run: bun run test:daemon

      - name: Build daemon
        run: bun run --cwd packages/vite-plugin-fable postinstall

      - name: Build sample
        run: bun run build
        working-directory: ./sample-project

      - name: Build docs
        run: dotnet fsdocs build --noapidocs --projects "$(pwd)/packages/vite-plugin-fable/Fable.Daemon/Fable.Daemon.fsproj"
